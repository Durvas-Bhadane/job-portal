################################################################################
#  /etc/nginx/sites-available/job-portal
#  Symlink to: /etc/nginx/sites-enabled/job-portal
################################################################################

server {
    listen 80;
    server_name _;          # Matches any hostname — replace with your domain later

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ── Health check for ALB (no auth, fast response) ─────────
    location /health {
        proxy_pass http://localhost:5000/health;
        access_log off;
    }

    # ── API — proxy to Node.js / PM2 ──────────────────────────
    location /api/ {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Upload size limit (covers resume/image uploads)
        client_max_body_size 15M;
    }

    # ── React Frontend — serve static build ───────────────────
    location / {
        root  /var/www/job-portal/client/build;
        index index.html;
        try_files $uri $uri/ /index.html;    # SPA fallback

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
